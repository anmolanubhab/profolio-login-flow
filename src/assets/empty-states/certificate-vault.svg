<svg width="480" height="320" viewBox="0 0 480 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
  <!-- Profolio Certificate Vault empty-state illustration.
       Original flat artwork (no third-party assets). Safe on light & dark
       surfaces. Replace this file with the supplied raster (same path, or add
       certificate-vault.webp and update the import in EmptyState consumers)
       if pixel-parity with the design mock is required. -->

  <!-- soft background blob -->
  <ellipse cx="292" cy="150" rx="150" ry="120" fill="#3B82F6" fill-opacity="0.12"/>
  <circle cx="120" cy="96" r="12" fill="#F87171" fill-opacity="0.5"/>

  <!-- certificate -->
  <g>
    <path d="M250 78h150a10 10 0 0 1 10 10v150a10 10 0 0 1-10 10H250a10 10 0 0 1-10-10V88a10 10 0 0 1 10-10Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <path d="M400 78l10 10h-10V78Z" fill="#DBEAFE"/>
    <rect x="240" y="78" width="170" height="30" rx="10" fill="#60A5FA"/>
    <rect x="240" y="98" width="170" height="10" fill="#3B82F6" fill-opacity="0.25"/>
    <!-- rosette -->
    <circle cx="325" cy="150" r="24" fill="#3B82F6"/>
    <circle cx="325" cy="150" r="14" fill="#FFFFFF" fill-opacity="0.35"/>
    <path d="M313 168l-8 26 16-9 4 5-2-24Z" fill="#2563EB"/>
    <path d="M337 168l8 26-16-9-4 5 2-24Z" fill="#2563EB"/>
    <!-- text lines -->
    <rect x="266" y="196" width="118" height="9" rx="4.5" fill="#E2E8F0"/>
    <rect x="266" y="214" width="96" height="9" rx="4.5" fill="#E2E8F0"/>
    <rect x="266" y="232" width="70" height="9" rx="4.5" fill="#EEF2F7"/>
  </g>

  <!-- books -->
  <g>
    <rect x="360" y="250" width="86" height="16" rx="4" fill="#3B82F6"/>
    <rect x="352" y="266" width="94" height="16" rx="4" fill="#4ADE80" fill-opacity="0.85"/>
  </g>

  <!-- plant -->
  <g stroke="#4ADE80" stroke-width="3" stroke-linecap="round">
    <path d="M96 268c0-26 4-44 14-60"/>
  </g>
  <path d="M110 214c10-6 22-4 30 4-10 8-22 8-30-4Z" fill="#86EFAC"/>
  <path d="M100 238c-10-4-16-14-16-26 12 0 20 10 16 26Z" fill="#86EFAC"/>
  <path d="M104 250c8-8 20-10 30-6-6 12-20 16-30 6Z" fill="#86EFAC"/>

  <!-- person -->
  <g>
    <!-- crossed legs -->
    <path d="M120 270c8-22 30-34 58-34 24 0 40 10 46 24 3 8-2 14-12 14h-80c-9 0-15-6-12-4Z" fill="#93C5FD"/>
    <path d="M132 268c14-14 34-20 56-16" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.25"/>
    <!-- torso -->
    <path d="M150 214c0-18 12-30 30-30s30 12 30 30v18c0 8-6 14-14 14h-32c-8 0-14-6-14-14v-18Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <!-- arm resting -->
    <path d="M178 200c-10 4-16 14-16 26" stroke="#F2B89A" stroke-width="12" stroke-linecap="round" fill="none"/>
    <!-- head -->
    <circle cx="180" cy="170" r="20" fill="#F2B89A"/>
    <path d="M162 166c-2-16 8-28 20-28s22 10 20 26c-4-6-10-10-20-10s-16 6-20 12Z" fill="#1F2937"/>
    <circle cx="200" cy="150" r="7" fill="#1F2937"/>
    <!-- hand to chin -->
    <circle cx="176" cy="188" r="6" fill="#F2B89A"/>
    <!-- feet -->
    <ellipse cx="150" cy="272" rx="10" ry="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  </g>

  <!-- ground line -->
  <path d="M96 284h330" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>

  <!-- paper plane -->
  <g>
    <path d="M404 70l34-14-14 34-6-14-14-6Z" fill="#93C5FD"/>
    <path d="M424 90l14-34" stroke="#93C5FD" stroke-width="2"/>
    <path d="M392 96c8-2 12-8 10-16" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1 7" fill="none"/>
  </g>
</svg>
