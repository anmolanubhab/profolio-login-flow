<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Profolio — Offline</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: env(safe-area-inset-top) 1.5rem env(safe-area-inset-bottom);
        font-family: Inter, "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
        background: #f2f3f5;
        color: #23262b;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0b1220; color: #e6e9ef; }
      }
      .card { max-width: 22rem; text-align: center; }
      .logo {
        width: 56px; height: 56px; border-radius: 14px;
        background: #0063cc; color: #fff;
        display: grid; place-items: center;
        font-weight: 700; font-size: 34px; margin: 0 auto 1rem;
      }
      h1 { font-size: 1.15rem; margin: 0 0 .35rem; }
      p { margin: 0 0 1.25rem; opacity: .75; font-size: .95rem; line-height: 1.5; }
      button {
        appearance: none; border: 0; cursor: pointer;
        background: #0063cc; color: #fff;
        font: inherit; font-weight: 600;
        padding: .7rem 1.4rem; border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">P</div>
      <h1>You're offline</h1>
      <p>Profolio can't reach the network right now. Check your connection and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
