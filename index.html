<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Profolio - Your Future, Verified</title>
    <meta name="description" content="Professional portfolio platform for students and employers" />
    <meta name="author" content="Profolio" />

    <!-- PWA / standalone. `viewport-fit=cover` lets Android 15+ / Chrome 132+
         draw the app edge-to-edge (system bars become scrims). Where that is
         NOT supported the WebAPK paints a solid status bar with `theme_color`
         (baked in at install time) -- so it is set to #f2f3f5, matching the
         Profolio `background_color` token and the light app chrome, instead of
         a stark #ffffff that reads as a separate white band above the header. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f2f3f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Profolio" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <meta property="og:title" content="Profolio - Your Future, Verified" />
    <meta property="og:description" content="Professional portfolio platform for students and employers" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
